services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Bridge host-loopback Ollama (127.0.0.1:11434) so the API container can reach it
  # without changing OLLAMA_HOST. Listens on host :11435 → 127.0.0.1:11434.
  ollama-proxy:
    image: alpine/socat:1.8.0.1
    network_mode: host
    command: TCP-LISTEN:11435,fork,reuseaddr TCP:127.0.0.1:11434
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    extra_hosts:
      # Reach ollama-proxy (and other host services) from the API container
      - "host.docker.internal:host-gateway"
    environment:
      DATA_DIR: /data
      SQLITE_URL: sqlite+aiosqlite:////data/rageval.db
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: sentence_transformers
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      # Via ollama-proxy on the host (see service above); Ollama can stay on 127.0.0.1
      OLLAMA_BASE_URL: http://host.docker.internal:11435
      # Persist Hugging Face / sentence-transformers weights across container rebuilds
      HF_HOME: /models
      HUGGINGFACE_HUB_CACHE: /models/hub
      TRANSFORMERS_CACHE: /models/transformers
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
      # Token from host/.env — higher HF rate limits (also used by huggingface_hub)
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      # Prefer live-mounted PEM when present; image also ships a build-time bundle.
      # Override with GIGACHAT_CA_BUNDLE if needed. DER/GOST dumps are skipped by the client.
      GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-/certs/russian_trusted_root_ca_pem.crt}
    volumes:
      - data:/data
      - hf_models:/models
      # Optional live CA files without rebuild (see certs/README.md)
      - ./certs:/certs:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-proxy:
        condition: service_started

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  qdrant_storage:
  data:
  hf_models:
